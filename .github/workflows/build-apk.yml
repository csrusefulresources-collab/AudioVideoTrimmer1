name: Build Audio Video Trimmer APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: AudioVideoTrimmer

      - name: Verify project files
        working-directory: AudioVideoTrimmer
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/signing/trimmer.p12
          chmod +x gradlew

      - name: Run unit tests
        working-directory: AudioVideoTrimmer
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: AudioVideoTrimmer
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: AudioVideoTrimmer
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AudioVideoTrimmer-debug
          path: AudioVideoTrimmer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: AudioVideoTrimmer-release
          path: AudioVideoTrimmer/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
